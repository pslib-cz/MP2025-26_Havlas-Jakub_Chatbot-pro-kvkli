# Apache vhost snippet for kvkli.cz
#
# Add this inside your existing <VirtualHost *:443> block in kvkli.conf
# (or wherever your kvkli HTTPS vhost is configured).
#
# What it does:
#   /widget.js            → serves the file from /var/www/kvkli/widget.js
#   /widget.js is already referenced by the homepage HTML, nothing else to change.
#
# ── Serving widget.js directly (no proxy needed, it is a static file) ──────
# Apache already serves /var/www/kvkli statically, so widget.js is available
# automatically once you copy it there. No extra config needed for that.
#
# ── Optional: proxy /chatbot-api/ to the backend (avoids cross-origin) ─────
# If you want to avoid CORS entirely (recommended), uncomment the block below.
# This makes the widget call /chatbot-api/api/graphql on the SAME origin,
# so no cross-origin header gymnastics are needed at all.
#
# Prerequisites: mod_proxy + mod_proxy_http enabled:
#   sudo a2enmod proxy proxy_http
#   sudo systemctl reload apache2

# <Location /chatbot-api/>
#     ProxyPreserveHost On
#     ProxyPass        https://chatbot.kvkli.cz/
#     ProxyPassReverse https://chatbot.kvkli.cz/
# </Location>
#
# Then set data-backend="/chatbot-api" in the widget script tag:
#   <script src="/widget.js" data-backend="/chatbot-api"></script>
