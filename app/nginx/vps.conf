# nginx/vps.conf
# VPS test deployment using sslip.io (no real domain needed)
# Hostname: 144-91-77-107.sslip.io  → resolves to 144.91.77.107

# ─── HTTP: ACME challenge + redirect ───────────────────────────────────────
server {
    listen 80;
    server_name 144-91-77-107.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: serve widget.js + reverse proxy to Next.js ─────────────────────
server {
    listen 443 ssl;
    server_name 144-91-77-107.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/144-91-77-107.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/144-91-77-107.sslip.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    proxy_connect_timeout 600;
    proxy_send_timeout    600;
    proxy_read_timeout    600;
    send_timeout          600;

    # ── Serve widget.js + test page as static files directly from nginx ───────
    # Place the built widget.js in ./widget/ on the host;
    # it will be accessible at https://144-91-77-107.sslip.io/widget.js
    location = /widget.js {
        root /var/www/widget;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # Simple test page served from the same directory
    location = /widget-test.html {
        root /var/www/widget;
        add_header Cache-Control "no-store";
    }

    # ── Everything else → Next.js app ──────────────────────────────────────
    location / {
        proxy_pass         http://app:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
