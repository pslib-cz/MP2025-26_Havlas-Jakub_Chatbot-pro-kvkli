map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Reject unknown plain HTTP hosts (avoid accidental fallback routing)
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Reject unknown HTTPS hosts (avoid accidental fallback routing)
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/144-91-77-107.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/144-91-77-107.sslip.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}

# HTTP -> HTTPS redirect for widget hostname + ACME challenge
server {
    listen 80;
    server_name widget.144-91-77-107.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP -> HTTPS redirect for chatbot hostname + ACME challenge
