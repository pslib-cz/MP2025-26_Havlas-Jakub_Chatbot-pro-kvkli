# ─── HTTP: redirect to HTTPS + ACME challenge ──────────────────────────────
server {
    listen 80;
    server_name chatbot.kvkli.cz;

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: reverse proxy to Next.js ───────────────────────────────────────
server {
    listen 443 ssl;
    server_name chatbot.kvkli.cz;

    ssl_certificate     /etc/letsencrypt/live/chatbot.kvkli.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatbot.kvkli.cz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Long timeouts – AI responses can take time
    proxy_connect_timeout 600;
    proxy_send_timeout    600;
    proxy_read_timeout    600;
    send_timeout          600;

    # Forward all traffic to Next.js app container
    location / {
        proxy_pass         http://app:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js dev hot-reload / future push)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
