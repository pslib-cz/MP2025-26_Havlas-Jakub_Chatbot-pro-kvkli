services:
    app:
        build: .
        container_name: nextjs_app
        restart: always
        env_file:
            - .env
        volumes:
            - ./logs:/app/logs
        depends_on:
            chromadb:
                condition: service_healthy
            db:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            CHROMA_URL: http://chromadb:8000
        expose:
            - "3000"
        networks:
            - app-network

    db:
        image: postgres:16
        container_name: postgres
        restart: always
        env_file:
            - .env
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - app-network

    chromadb:
        image: chromadb/chroma:0.4.24
        container_name: chromadb
        restart: always
        volumes:
            - chroma_data:/chroma/chroma
        environment:
            IS_PERSISTENT: "TRUE"
            ANONYMIZED_TELEMETRY: "False"
        expose:
            - "8000"
        healthcheck:
            test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/8000' || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - app-network

    nginx:
        image: nginx:stable
        container_name: nginx
        restart: always
        ports:
            - "80:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    postgres_data:
    chroma_data:
