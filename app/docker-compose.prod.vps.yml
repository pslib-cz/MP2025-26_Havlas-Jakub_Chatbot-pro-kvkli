services:
    app:
        build: .
        restart: always
        env_file:
            - .env
        volumes:
            - ./logs:/app/logs
        depends_on:
            chromadb:
                condition: service_healthy
            db:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            CHROMA_URL: http://chromadb:8000
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://144-91-77-107.sslip.io,https://widget.144-91-77-107.sslip.io,https://www.kvkli.cz,https://kvkli.cz,https://www.kvkli.cz/}
        expose:
            - "3000"
        networks:
            - vps-network

    # ── PostgreSQL ────────────────────────────────────────────────────────
    db:
        image: postgres:16
        restart: always
        env_file:
            - .env
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - vps-network

    # ── ChromaDB ─────────────────────────────────────────────────────────
    chromadb:
        image: chromadb/chroma:latest
        restart: always
        volumes:
            - ./chroma_db:/data
        environment:
            IS_PERSISTENT: "TRUE"
            ANONYMIZED_TELEMETRY: "False"
        expose:
            - "8000"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/8000' || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - vps-network

    # ── nginx: SSL termination, widget.js static, reverse proxy ──────────
    nginx:
        image: nginx:stable
        restart: always
        ports:
            - "80:80"
            - "443:443"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./nginx/vps.conf:/etc/nginx/conf.d/default.conf:ro
            - ./certbot/conf:/etc/letsencrypt:ro
            - ./certbot/www:/var/www/certbot:ro
            - ./widget:/var/www/widget:ro
        networks:
            - vps-network

    certbot:
        image: certbot/certbot:latest
        restart: unless-stopped
        volumes:
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        command: >
            sh -c "trap exit TERM;
            while :; do
            certbot renew --webroot -w /var/www/certbot --quiet;
            sleep 12h & wait $${!};
            done"
    certbot-init:
        image: certbot/certbot:latest
        volumes:
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot

networks:
    vps-network:
        driver: bridge

volumes:
    postgres_data:
