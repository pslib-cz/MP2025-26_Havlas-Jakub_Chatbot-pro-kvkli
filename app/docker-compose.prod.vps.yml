services:
    app:
        container_name: myapp
        image: ghcr.io/pslib-cz/kvkli-app:latest
        restart: always
        env_file:
            - .env
        volumes:
            - ./logs:/app/logs
        depends_on:
            chromadb:
                condition: service_healthy
            db:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            CHROMA_URL: http://chromadb:8000
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
        expose:
            - "3000"
        networks:
            - vps-network

    # ── PostgreSQL ────────────────────────────────────────────────────────
    db:
        image: postgres:16
        restart: always
        env_file:
            - .env
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - vps-network

    # ── ChromaDB ─────────────────────────────────────────────────────────
    chromadb:
        image: chromadb/chroma:latest
        restart: always
        volumes:
            - ./chroma_db:/data
        environment:
            IS_PERSISTENT: "TRUE"
            ANONYMIZED_TELEMETRY: "False"
        expose:
            - "8000"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/8000' || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - vps-network

networks:
    vps-network:
        external: true

volumes:
    postgres_data:
