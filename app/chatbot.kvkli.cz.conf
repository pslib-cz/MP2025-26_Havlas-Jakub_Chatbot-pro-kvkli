# ══════════════════════════════════════════════════════════════════════════════
# Apache VirtualHost — chatbot.kvkli.cz
# Install:  sudo cp chatbot.kvkli.cz.conf /etc/apache2/sites-available/
#           sudo a2ensite chatbot.kvkli.cz
#           sudo systemctl reload apache2
#
# Required modules:
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl
#   sudo systemctl restart apache2
# ══════════════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName chatbot.kvkli.cz
    
    # Redirect all HTTP to HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://chatbot.kvkli.cz$1 [R=301,L]
</VirtualHost>

# ── HTTPS VirtualHost ────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName chatbot.kvkli.cz

    # ── SSL ───────────────────────────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/chatbot.kvkli.cz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/chatbot.kvkli.cz/privkey.pem

    # Modern SSL settings
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder   off

    # ── Reverse Proxy to Next.js ──────────────────────────────────────────
    ProxyPreserveHost On
    ProxyPass         / http://127.0.0.1:3000/
    ProxyPassReverse  / http://127.0.0.1:3000/

    # Longer timeout for GraphQL crawl operations (up to 10 min)
    ProxyTimeout 600

    # ── Forwarded Headers ─────────────────────────────────────────────────
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    # ── Security Headers ──────────────────────────────────────────────────
    Header always set X-Robots-Tag        "noindex, nofollow, noarchive"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options     "DENY"
    Header always set X-XSS-Protection    "1; mode=block"
    Header always set Referrer-Policy     "strict-origin-when-cross-origin"
    Header always set Permissions-Policy  "camera=(), microphone=(), geolocation=()"

    # Remove server version info
    Header always unset X-Powered-By
    ServerTokens Prod
    ServerSignature Off


    # ── Logging ───────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/chatbot-error.log
    CustomLog ${APACHE_LOG_DIR}/chatbot-access.log combined
</VirtualHost>
