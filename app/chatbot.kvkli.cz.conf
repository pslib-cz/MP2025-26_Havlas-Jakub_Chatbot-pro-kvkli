
<VirtualHost *:80>
    ServerName chatbot.kvkli.cz
    
    
    RewriteEngine On
    RewriteRule ^(.*)$ https://chatbot.kvkli.cz$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName chatbot.kvkli.cz

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/chatbot.kvkli.cz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/chatbot.kvkli.cz/privkey.pem

   
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder   off

    ProxyPreserveHost On
    ProxyPass         / http://127.0.0.1:3000/
    ProxyPassReverse  / http://127.0.0.1:3000/

   
    ProxyTimeout 600

    
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    
    Header always set X-Robots-Tag        "noindex, nofollow, noarchive"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options     "DENY"
    Header always set X-XSS-Protection    "1; mode=block"
    Header always set Referrer-Policy     "strict-origin-when-cross-origin"
    Header always set Permissions-Policy  "camera=(), microphone=(), geolocation=()"

    
    Header always unset X-Powered-By
    ServerTokens Prod
    ServerSignature Off


    
    ErrorLog  ${APACHE_LOG_DIR}/chatbot-error.log
    CustomLog ${APACHE_LOG_DIR}/chatbot-access.log combined
</VirtualHost>
