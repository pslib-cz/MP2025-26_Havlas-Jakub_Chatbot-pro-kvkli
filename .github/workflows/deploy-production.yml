name: Deploy Backend to Production VPS

# on:
#     push:
#         branches: [production]
#         paths:
#             - "app/**"
#             - ".github/workflows/deploy-production.yml"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: app/package-lock.json

            - name: Install dependencies
              working-directory: ./app
              run: npm ci

            - name: Run unit tests
              working-directory: ./app
              run: npm run test:unit

            - name: Run smoke tests
              working-directory: ./app
              run: npm run test:smoke

    build-and-deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ./app
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/kvkli-app:latest
                      ghcr.io/${{ github.repository_owner }}/kvkli-app:${{ github.sha }}

            - name: Configure SSH key
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' '${{ secrets.PROD_SSH_KEY }}' > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519

            - name: Add VPS to known_hosts
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

            - name: Copy docker-compose to VPS
              run: |
                  scp app/docker-compose.kvkli.yml ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/var/www/apollo/docker-compose.kvkli.yml

            - name: Deploy with Docker Compose
              run: |
                  ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} "echo '${{ secrets.GITHUB_TOKEN }}' | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin"
                  ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} bash << 'EOF'
                  cd /var/www/apollo
                  sudo docker-compose -f docker-compose.kvkli.yml pull
                  sudo docker-compose -f docker-compose.kvkli.yml up -d --remove-orphans
                  echo "Waiting for app to be healthy..."
                  sleep 10
                  sudo docker-compose -f docker-compose.kvkli.yml ps
                  EOF
