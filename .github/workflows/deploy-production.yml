name: Deploy Backend to Production VPS

on:
    push:
        branches: [production]
        paths:
            - "app/**"
            - ".github/workflows/deploy-production.yml"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: app/package-lock.json

            - name: Install dependencies
              working-directory: ./app
              run: npm ci

            - name: Run unit tests
              working-directory: ./app
              run: npm run test:unit

            - name: Run smoke tests
              working-directory: ./app
              run: npm run test:smoke

    build-and-deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ./app
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/kvkli-app:latest
                      ghcr.io/${{ github.repository_owner }}/kvkli-app:${{ github.sha }}

            - name: Configure SSH key
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' '${{ secrets.PROD_SSH_KEY }}' > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519

            - name: Add VPS to known_hosts
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -p 2222 -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

            - name: Copy docker-compose to VPS
              run: |
                  scp -P 2222 app/docker-compose.kvkli.yml ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/var/www/apollo/docker-compose.kvkli.yml

            - name: Deploy with Docker Compose
              run: |
                  ssh -p 2222 ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} "echo '${{ secrets.GITHUB_TOKEN }}' | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin"
                  ssh -p 2222 ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} bash << 'EOF'
                  set -e
                  cd /var/www/apollo

                  # Pull new image
                  sudo docker-compose -f docker-compose.kvkli.yml pull

                  # Snap Docker AppArmor bug: must restart snap before stopping containers
                  sudo snap restart docker
                  # Wait for Docker daemon to be ready again
                  for i in $(seq 1 30); do
                    sudo docker info >/dev/null 2>&1 && break
                    echo "Waiting for Docker daemon... ($i)"
                    sleep 2
                  done

                  # Now stop and recreate
                  sudo docker-compose -f docker-compose.kvkli.yml down --timeout 60 || {
                    echo "Down failed, force-removing containers..."
                    sudo docker rm -f kvkli-chatbot kvkli-postgres kvkli-chromadb 2>/dev/null || true
                  }
                  sudo docker-compose -f docker-compose.kvkli.yml up -d --remove-orphans

                  # Wait for health checks
                  echo "Waiting for app to be healthy..."
                  sleep 20
                  sudo docker-compose -f docker-compose.kvkli.yml ps
                  EOF
