name: Deploy App to VPS

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      
      - name: Install dependencies
        working-directory: ./app
        run: npm ci
      
      - name: Run unit tests
        working-directory: ./app
        run: npm run test:unit

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure target directory exists
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /var/www/apollo"

      - name: Sync app files to VPS
        run: |
          rsync -az \
            --exclude=node_modules \
            --exclude=.env \
            app/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/apollo/

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
              set -e
              cd /var/www/apollo
        
              cat << 'ENVEOF' > .env
          ${{ secrets.ENV_FILE }}
          ENVEOF
        
              # Stop and remove all containers including orphans
              docker compose -f docker-compose.prod.yml down --remove-orphans
              
              # Remove any dangling containers with the same names
              docker rm -f chromadb postgres nextjs_app nginx 2>/dev/null || true
              
              # Build and start services
              docker compose -f docker-compose.prod.yml build
              docker compose -f docker-compose.prod.yml up -d
              
              # Wait for database to be ready
              sleep 10
              
              # Run Prisma migrations
              docker compose -f docker-compose.prod.yml exec -T app npx prisma migrate deploy
          EOF