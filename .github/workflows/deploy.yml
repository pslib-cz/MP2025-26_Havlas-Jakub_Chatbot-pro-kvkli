name: Deploy App to VPS

on:
    push:
        branches: [main]
        paths:
            - "app/**"
            - ".github/workflows/deploy.yml"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: app/package-lock.json

            - name: Install dependencies
              working-directory: ./app
              run: npm ci

            - name: Run unit tests
              working-directory: ./app
              run: npm run test:unit

            - name: Run smoke tests
              working-directory: ./app
              run: npm run test:smoke

    build-and-deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ./app
                  push: true
                  tags: ghcr.io/${{ github.repository_owner }}/kvkli-app:latest

            - name: Configure SSH key
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' '${{ secrets.VPS_SSH_KEY }}' > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519

            - name: Add VPS to known_hosts
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

            - name: Copy docker-compose to VPS
              run: |
                  scp app/docker-compose.prod.vps.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/apollo/docker-compose.prod.vps.yml

            - name: Build widget bundle
              working-directory: ./app
              run: |
                  npm ci
                  node build-widget.mjs

            - name: Publish widget test page to VPS
              run: |
                  ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /var/www/widget"
                  scp app/widget/widget-test.html ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/widget/index.html
                  scp app/widget/widget.js ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/widget/widget.js

            - name: Deploy with Docker Compose (pull image)
              run: |
                  ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin"
                  ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash << 'EOF'
                  cd /var/www/apollo
                  docker compose -f docker-compose.prod.vps.yml pull
                  docker compose -f docker-compose.prod.vps.yml up -d --remove-orphans
                  EOF
