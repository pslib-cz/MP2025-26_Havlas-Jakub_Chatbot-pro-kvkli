name: Deploy App to VPS

on:
    push:
        branches: [main]
        paths:
            - "app/**"
            - ".github/workflows/deploy.yml"

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: app/package-lock.json

            - name: Install dependencies
              working-directory: ./app
              run: npm ci

            - name: Run unit tests
              working-directory: ./app
              run: npm run test:unit

    deploy:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup SSH agent
              uses: webfactory/ssh-agent@v0.9.0
              with:
                  ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

            - name: Add VPS to known_hosts
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

            - name: Ensure target directory exists
              run: |
                  ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /var/www/apollo"

            - name: Sync app files to VPS
              run: |
                  rsync -az \
                    --exclude=node_modules \
                    --exclude=.env \
                    app/ \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/apollo/

            - name: Deploy with Docker Compose
              run: |
                  ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
                      set -e
                      cd /var/www/apollo

                      cat << 'ENVEOF' > .env
                  ${{ secrets.ENV_FILE }}
                  ENVEOF

                      # Stop and remove all containers including orphans
                      docker compose -f docker-compose.prod.yml down --remove-orphans
                      
                      # Remove any dangling containers with the same names
                      docker rm -f chromadb postgres nextjs_app nginx 2>/dev/null || true
                      
                      # Build and start services
                      docker compose -f docker-compose.prod.yml build
                      docker compose -f docker-compose.prod.yml up -d
                      
                      # Wait for services to be healthy with detailed logging
                      echo "Waiting for services to be healthy..."
                      for i in {1..30}; do
                        echo "Check $i/30..."
                        docker compose -f docker-compose.prod.yml ps
                        
                        # Check if chromadb is unhealthy and show logs
                        if docker compose -f docker-compose.prod.yml ps | grep -q "chromadb.*unhealthy"; then
                          echo "⚠️  ChromaDB is unhealthy, showing logs:"
                          docker logs chromadb --tail 50
                        fi
                        
                        # Check if all required services are healthy
                        if docker compose -f docker-compose.prod.yml ps | grep -E "(chromadb|postgres)" | grep -q "healthy"; then
                          if [ $(docker compose -f docker-compose.prod.yml ps | grep -E "(chromadb|postgres)" | grep -c "healthy") -eq 2 ]; then
                            echo "✓ All services healthy"
                            break
                          fi
                        fi
                        
                        sleep 2
                      done
                      
                      # Final status check
                      echo "Final service status:"
                      docker compose -f docker-compose.prod.yml ps
                      
                      # Show logs if any service failed
                      if docker compose -f docker-compose.prod.yml ps | grep -q "unhealthy"; then
                        echo "❌ Unhealthy services detected:"
                        docker logs chromadb --tail 100
                        docker logs postgres --tail 50
                        exit 1
                      fi
                      
                      # Run Prisma migrations
                      docker compose -f docker-compose.prod.yml exec -T app npx prisma migrate deploy
                  EOF
